<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Localizador – Memorial Santa Cruz</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/style.css">
<style>
html,body{overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#map{position:fixed;inset:0}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.8rem 1.4rem;background:linear-gradient(#0c1511ee,#0c151100);pointer-events:none}
header h1{margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.02em}header small{color:var(--muted);display:block;font-size:.85rem}
header .logo{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#241c05;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
#panel{position:fixed;z-index:6;left:1.2rem;top:5.2rem;bottom:1.2rem;width:min(460px,92vw);display:flex;flex-direction:column;gap:.8rem;pointer-events:none}
#panel>*{pointer-events:auto}
.card{background:#101c15f0;border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);box-shadow:0 10px 40px #0008}
#searchbox{padding:1rem}
#q{font-size:1.5rem;padding:.7em .9em}
#hint{color:var(--muted);margin:.5rem 0 0;font-size:.95rem}
#results{overflow:auto;flex:0 1 auto;min-height:0}
#results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:.85rem 1rem}
#results button:active,#results button:hover{background:var(--panel2)}
#results b{font-size:1.15rem;display:block}#results span{color:var(--muted);font-size:.9rem}
#kb{padding:.6rem;display:grid;gap:.4rem}
#kb .row{display:flex;gap:.4rem;justify-content:center}
#kb button{flex:1;min-width:0;padding:.75em 0;font-size:1.25rem;font-weight:600;border-radius:9px}
#kb .wide{flex:3}
#detail{padding:1.1rem 1.2rem;display:none}
#detail h2{margin:.2rem 0 .1rem;font-size:1.6rem}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin:.8rem 0}
#detail dt{color:var(--muted)}#detail dd{margin:0;font-weight:600}
.big{font-size:1.1rem;padding:.8em 1.2em}
.badge{display:inline-block;padding:.2em .8em;border-radius:99px;font-weight:700;font-size:.9rem;background:var(--panel2);border:1px solid var(--brand);color:var(--brand)}
#legend{position:fixed;right:1rem;top:5rem;z-index:5;padding:.7rem .9rem;font-size:.85rem}
#legend div{margin:.15rem 0}
#overlay{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#1f3b2cf2,#07100bfa);display:none;align-items:center;justify-content:center;text-align:center;padding:2rem}
#overlay.show{display:flex}
#overlay .box{max-width:820px;width:100%}
#overlay h2{font-size:2.2rem;margin:.2em 0 .4em}
.opts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin:1.4rem 0}
.opts button{font-size:1.6rem;padding:.7em 1em;min-width:3.4rem}
.opts.nps{gap:.5rem}.opts.nps button{min-width:3.6rem;padding:.7em .6em}
.opts button.sel{background:var(--brand);color:#241c05}
.scale{display:flex;justify-content:space-between;color:var(--muted);max-width:760px;margin:0 auto}
.dots{margin-top:1.5rem;color:var(--muted)}
.welcome-btn{font-size:1.8rem;padding:.9em 2em;margin-top:1.5rem}
.pulse{width:22px;height:22px;border-radius:50%;background:#ffd23f;border:3px solid #fff;box-shadow:0 0 0 0 #ffd23faa;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 28px #ffd23f00}100%{box-shadow:0 0 0 0 #ffd23f00}}
.pin{font-size:34px;filter:drop-shadow(0 2px 3px #000);transform:translateY(-14px)}
@media (max-width:760px){#panel{top:4.6rem}#legend{display:none}}
@media (max-height:760px){#kb button{padding:.5em 0;font-size:1.05rem}}
</style>
</head>
<body>
<div id="map"></div>
<header><div class="logo">✝</div><div><h1 id="title">Memorial Santa Cruz</h1><small id="sub">Localizador de jazigos</small></div></header>
<div id="panel">
  <div id="searchbox" class="card">
    <input id="q" placeholder="Digite o nome do ente querido" autocomplete="off" inputmode="none" readonly>
    <p id="hint">Use o teclado abaixo. Você pode digitar apenas parte do nome.</p>
  </div>
  <div id="results" class="card" hidden></div>
  <div id="detail" class="card"></div>
  <div id="kb" class="card"></div>
</div>
<div id="legend" class="card"></div>
<div id="overlay"></div>
<script src="/vendor/maplibre-gl.js"></script>
<script type="module" src="/kiosk.js"></script>
</body>
</html>
